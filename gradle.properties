# Nexus 私服配置说明：
# - 修改 nexusUrl 为你的 Nexus 仓库地址（如 http://your-nexus:8081/repository）
# - 修改 nexusUsername / nexusPassword 为你的 Nexus 登录凭据
# - 也可以通过环境变量 NEXUS_URL / NEXUS_USERNAME / NEXUS_PASSWORD 覆盖对应配置
project.group=com.example
project.version=0.0.1-SNAPSHOT
nexusUrl=http://localhost:8081/repository
nexusUsername=admin
nexusPassword=admin123
org.gradle.jvmargs=-Xmx1024m
kotlin.code.style=official
